services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siteops
      POSTGRES_PASSWORD: siteops
      POSTGRES_DB: siteops
    ports:
      - "5432:5432"
    volumes:
      - siteops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteops -d siteops"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: siteops
      MINIO_ROOT_PASSWORD: siteops123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - siteops_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  siteops_postgres_data:
  siteops_minio_data:
